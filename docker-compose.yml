services:
  api:
    build: .
    image: ai-data-analyst
    container_name: ai-data-analyst-api
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=openai
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - APP_API_KEY=${APP_API_KEY:-}
      - DEBUG=${DEBUG:-false}
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    volumes:
      # persist uploads, the RAG vector store, and the embedding-model cache
      - ./data/uploads:/app/data/uploads
      - ./data/rag_store:/app/data/rag_store
      - ./data/embed_cache:/app/data/embed_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    # reuses the same image (streamlit ships in requirements.txt); no runtime pip install
    image: ai-data-analyst
    container_name: ai-data-analyst-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
