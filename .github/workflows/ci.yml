name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      LLM_PROVIDER: none          # fully offline: rule engine, no API keys needed
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch (keeps the install small)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run test suite
        working-directory: backend
        run: python -m pytest -q

      - name: Run SQL accuracy benchmark
        if: hashFiles('scripts/benchmark_sql.py') != ''
        # regression gate for the offline rule engine (currently 98.8%)
        run: python scripts/benchmark_sql.py --fail-below 0.95
