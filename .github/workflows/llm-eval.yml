name: LLM eval

# Live evaluation against a real LLM. Not run on every push: the Groq free tier
# has per-minute and per-day token limits. Needs the repository secret
# GROQ_API_KEY (Settings → Secrets and variables → Actions); without it the
# job skips cleanly, e.g. on forks.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model to evaluate
        default: openai/gpt-oss-20b
      sql_splits:
        description: SQL benchmark splits (space-separated)
        default: holdout-2 docs
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: llm-eval
  cancel-in-progress: false

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDER: openai
      GROQ_MODEL: ${{ inputs.model || 'openai/gpt-oss-20b' }}
      LLM_MODEL: ${{ inputs.model || 'openai/gpt-oss-20b' }}
      HF_HOME: ~/.cache/huggingface
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY secret is not set; skipping live LLM evaluation."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.available == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.available == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.key.outputs.available == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding + reranker models
        if: steps.key.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-embed-ms-marco-rerank-v1

      - name: Live smoke tests
        if: steps.key.outputs.available == 'true'
        working-directory: backend
        run: python -m pytest -m live_llm -q -rs

      - name: SQL benchmark (LLM + rule engine, with documents)
        if: always() && steps.key.outputs.available == 'true'
        run: >
          python scripts/benchmark_sql.py --split ${{ inputs.sql_splits || 'holdout-2 docs' }}
          --sleep 3 --json benchmarks/results/live_sql.json

      - name: SQL benchmark (LLM plans everything)
        if: always() && steps.key.outputs.available == 'true'
        run: >
          python scripts/benchmark_sql.py --llm-only --split ${{ inputs.sql_splits || 'holdout-2 docs' }}
          --sleep 3 --json benchmarks/results/live_sql_llm_only.json

      - name: Document-RAG benchmark (LLM answers)
        if: always() && steps.key.outputs.available == 'true'
        run: >
          python scripts/benchmark_rag.py --modes hybrid_rerank --sleep 2
          --json benchmarks/results/live_rag.json

      - name: Upload results
        if: always() && steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-${{ github.run_id }}
          path: benchmarks/results/live_*.json
          if-no-files-found: warn
